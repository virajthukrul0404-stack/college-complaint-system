# College Complaint & Feedback System Configuration
# Database Connection Settings
# Default is embedded H2 in MySQL mode for instant zero-config startup and development.
# To use MySQL 8, uncomment the MySQL settings below and configure your credentials.

# --- H2 (Default Zero-Config Mode) ---
db.driver=org.h2.Driver
db.url=jdbc:h2:./db/complaint_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.user=sa
db.password=

# --- MySQL 8 Configuration (Uncomment to use MySQL) ---
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/college_complaint_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# db.user=root
# db.password=root

# HikariCP Pool Configuration
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000

# File Upload Settings
upload.dir=./uploads
upload.maxFileSize=2097152

# Server Port
server.port=8080
